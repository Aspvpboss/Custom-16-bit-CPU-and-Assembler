

[package]
name = "Assembler"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"   # replaces panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
debug-assertions = false


[dependencies]
peak_alloc = "0.2.0"
