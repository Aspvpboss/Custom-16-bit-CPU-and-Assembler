[workspace]
resolver = "3"
members = [
    "crates/*"
]
default-members = ["crates/asm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
asm-core = { path = "crates/asm-core" }
asm-pass-one = { path = "crates/asm-pass-one" }
asm-pass-two = { path = "crates/asm-pass-two" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # replaces panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
debug-assertions = false


#cargo +nightly build --release --target x86_64-pc-windows-gnu -Z build-std=std,panic_abort